---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert BeeGFS services are running and enabled
      ansible.builtin.assert:
        that:
          - "item + '.service' in ansible_facts.services"
          - "ansible_facts.services[item + '.service'].state == 'running'"
          - "ansible_facts.services[item + '.service'].status == 'enabled'"
      loop:
        - beegfs-meta
        - beegfs-mgmtd
      loop_control:
        label: "{{ item }}"

    - name: Check the beegfs CLI exists on management hosts
      ansible.builtin.stat:
        path: /usr/sbin/beegfs
      register: beegfs_cli
      when: inventory_hostname in groups['cluster_beegfs_mgmt']

    - name: Assert the beegfs CLI is installed on management hosts
      ansible.builtin.assert:
        that:
          - beegfs_cli.stat.exists
        fail_msg: /usr/sbin/beegfs (beegfs-tools) is missing; alias.yml runs it on the mgmt host.
      when: inventory_hostname in groups['cluster_beegfs_mgmt']

    - name: Check the CLI certificate link on management hosts
      ansible.builtin.stat:
        path: /etc/beegfs/cert.pem
      register: beegfs_cli_cert
      when: inventory_hostname in groups['cluster_beegfs_mgmt']

    - name: Assert cert.pem isn't linked to the CA bundle on management hosts
      ansible.builtin.assert:
        that:
          - not (beegfs_cli_cert.stat.islnk | default(false))
        fail_msg: /etc/beegfs/cert.pem is mgmtd's certificate on the mgmt host and must not be replaced by beegfs_client_cli_ca_file.
      when: inventory_hostname in groups['cluster_beegfs_mgmt']

    - name: Get filesystem type of the BeeGFS metadata target
      ansible.builtin.command: findmnt -n -o FSTYPE --mountpoint /data/beegfs/beegfs_meta
      register: beegfs_meta_fstype_result
      changed_when: false

    - name: Assert the BeeGFS metadata target is XFS
      ansible.builtin.assert:
        that:
          - beegfs_meta_fstype_result.stdout == 'xfs'

    - name: Check BeeGFS mount paths exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: beegfs_mount_path
      loop:
        - /mnt/beegfs

    - name: Assert BeeGFS mount paths exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
      loop: "{{ beegfs_mount_path.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Get filesystem type for BeeGFS mount paths
      ansible.builtin.command: findmnt -n -o FSTYPE --target {{ item }}
      register: beegfs_mount_fstype
      changed_when: false
      loop:
        - /mnt/beegfs

    - name: Assert BeeGFS mount paths filesystem is beegfs
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - item.stdout == 'beegfs'
      loop: "{{ beegfs_mount_fstype.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check the per-mount BeeGFS client auth file exists
      ansible.builtin.stat:
        path: /etc/beegfs/conn-8004.auth
      register: beegfs_client_auth_file

    - name: Read connAuthFile of the BeeGFS client config
      ansible.builtin.command: grep -E '^connAuthFile' /etc/beegfs/beegfs-client-8004.conf
      register: beegfs_client_conn_auth_file
      changed_when: false

    - name: Assert the BeeGFS client mount uses its own auth file
      ansible.builtin.assert:
        that:
          - beegfs_client_auth_file.stat.exists
          # 0600: beegfs_conn_auth_beegfs_group defaults to false
          - beegfs_client_auth_file.stat.mode == '0600'
          - beegfs_client_conn_auth_file.stdout is search('= /etc/beegfs/conn-8004.auth$')
