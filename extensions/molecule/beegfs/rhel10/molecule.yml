---
dependency:
  name: galaxy
driver:
  name: vagrant
  provider:
    name: ${VAGRANT_PROVIDER:-libvirt}
platforms:
  - name: alma10.1-vagrant
    box: ${VAGRANT_ALMA10_BOX:-almalinux/10}
    cpus: 2
    memory: 4096
    # Two extra disks: one for the OSS storage target, one for the metadata
    # target - meta must not be auto-discovered onto the same device the OSS
    # entry statically claims (see disk_facts.yml). VirtualBox creates them
    # from the vm.disk lines (needs VAGRANT_EXPERIMENTAL=disks); libvirt from
    # the storage lines, which VirtualBox users override via
    # VAGRANT_PROVIDER_ARGS / VAGRANT_PROVIDER_ARGS_2 (e.g.
    # "check_guest_additions = false").
    instance_raw_config_args:
      - 'vm.disk :disk, name: "mySmallDisk", size: "10GB"'
      - 'vm.disk :disk, name: "metaDisk", size: "10GB"'
    provider_raw_config_args:
      - "${VAGRANT_PROVIDER_ARGS:-storage :file, size: '10G'}"
      - "${VAGRANT_PROVIDER_ARGS_2:-storage :file, size: '10G'}"
    groups:
      - cluster_beegfs_mgmt
      - cluster_beegfs_mds
      - cluster_beegfs_oss
      - cluster_beegfs_client
provisioner:
  name: ansible
  log: true
verifier:
  name: ansible
ansible:
  playbooks:
    prepare: ../playbooks/prepare.yml
    converge: ../playbooks/converge.yml
    verify: ../playbooks/verify.yml
