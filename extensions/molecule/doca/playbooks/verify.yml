---
- name: Test doca
  hosts: all
  become: true
  tasks:
    - name: Get DKMS status
      ansible.builtin.command: dkms status
      register: dkms_status
      changed_when: false

    - name: Assert mlnx-ofa_kernel DKMS module is installed
      ansible.builtin.assert:
        that:
          - dkms_status.stdout is search('(?m)^mlnx-ofa_kernel/')
          - dkms_status.stdout is search('(?m)^mlnx-ofa_kernel/[^,]+,\\s*[^,]+,\\s*[^:]+:\\s*installed\\b')
        fail_msg: |
          mlnx-ofa_kernel is not installed via DKMS.
          dkms status output was:
          {{ dkms_status.stdout }}

    - name: Read /run/reboot-required
      ansible.builtin.slurp:
        src: /run/reboot-required
      register: reboot_required

    - name: Assert the role asked for a reboot instead of rebooting
      ansible.builtin.assert:
        that:
          - (reboot_required.content | b64decode) is search('(?m)^clip\.hpc\.doca: DOCA packages installed$')
        fail_msg: "/run/reboot-required doesn't name the DOCA packages."
