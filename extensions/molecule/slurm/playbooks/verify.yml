---
- name: Test some services on all nodes
  hosts:
    - cluster_batch
    - cluster_login
    - cluster_control
    - cluster_db
  become: true
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Check if munge service is running and enabled
      ansible.builtin.assert:
        that:
          - "'munge.service' in services"
          - services['munge.service'].state == 'running'
          - services['munge.service'].status == 'enabled'
        fail_msg: "Munge service is not running and enabled"

    - name: Set expected sinfo output for missing compute node
      ansible.builtin.set_fact:
        expected_sinfo: |-
          compute1\*,up,infinite,1,idle,slurm-cluster-compute1-0
          compute2,up,infinite,(2|3),idle,slurm-cluster-compute1-0,slurm-cluster-compute2-(?:0|\[0-1\])
      when: "'slurm-cluster-compute2-1' not in groups['cluster_batch']"

    - name: Set expected sinfo output for added compute node
      ansible.builtin.set_fact:
        expected_sinfo: |-
          compute1\*,up,infinite,1,idle,slurm-cluster-compute1-0
          compute2,up,infinite,3,idle,slurm-cluster-compute1-0,slurm-cluster-compute2-\[0-1\]
      when: "'slurm-cluster-compute2-1' in groups['cluster_batch']"


- name: Import Compute test playbook
  ansible.builtin.import_playbook: tests/test_compute.yml

- name: Import DB test playbook
  ansible.builtin.import_playbook: tests/test_db.yml


- name: Import Runtime test playbook
  ansible.builtin.import_playbook: tests/test_runtime.yml

- name: Import REST API test playbook
  ansible.builtin.import_playbook: tests/test_rest.yml
