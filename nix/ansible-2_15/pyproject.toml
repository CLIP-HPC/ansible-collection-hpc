[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ansible-2.15"
version = "0.1.0"
description = "Ansible env for old deployment"
requires-python = ">=3.11,<3.12"
dependencies = [ ]

[tool.setuptools]
py-modules = []

[dependency-groups]
dev = [
  {include-group = "api"},
  {include-group = "test"},
  {include-group = "lint"},
  {include-group = "lsp"},
]
run = [
  "ansible-compat==3.0.2",
  "ansible-core==2.15.2",
]
api = [
  "requests<2.31",
]
lsp = [
  "python-lsp-server",
]
lint = [
  "rstcheck",
  "pycodestyle",
  "yamllint",
]
test = [
  "molecule==5.0.1",
  "molecule-plugins==23.4.1",
  "docker==6.1.3",
  "pytest-testinfra",
  "pytest<8.0.0",
  "jmespath",
  "junit-xml",
]
