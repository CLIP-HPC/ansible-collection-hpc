---
# Option to enable/disable services
beegfs_enable:
  mgmt: false
  meta: false
  oss: false
  mon: false
  client: false
  tuning: false

# Can be present or absent
beegfs_state: present

# with what to multiply the nodeid to get the target id in case a node is explictly set
beegfs_target_id_multiplier: 100

# Network interfaces in order of preference
# (leaving empty means InfiniBand & RDMA enabled devices are preferred)
beegfs_interfaces: []

# Distribution-specific parameters
beegfs_distro_vars:
  RedHat:
    beegfs_repo_url: "https://www.beegfs.io/release/latest-stable/dists/beegfs-rhel{{ ansible_distribution_major_version }}.repo"
    beegfs_repo_key: "https://www.beegfs.io/release/latest-stable/gpg/GPG-KEY-beegfs"
    beegfs_repo_file: "/etc/yum.repos.d/beegfs-rhel{{ ansible_distribution_major_version }}.repo"
    kernel_dev_pkg: "kernel-devel"
    rdma_dev_pkgs:
      - rdma-core
      - libibverbs
      - libibverbs-utils
      - librdmacm
      - libibumad
      - opensm
      - infiniband-diags
      - srptools
      - perftest
      - librdmacm-utils

  Debian:
    beegfs_repo_url: "https://www.beegfs.io/release/latest-stable/dists/beegfs-deb9.list"
    beegfs_repo_key: "https://www.beegfs.io/release/latest-stable/gpg/DEB-GPG-KEY-beegfs"
    beegfs_repo_file: "/etc/apt/sources.list.d/beegfs_deb9.list"
    kernel_dev_pkg: "linux-headers"
    rdma_dev_pkgs:
      - "librdmacm-dev"
      - "libibmad-dev"
      - "libibumad-dev"
      - "libibverbs-dev"
      - "libbeegfs-ib"

# BeeGFS repo
beegfs_add_repos: true
beegfs_repo_url: "{{ beegfs_distro_vars[ansible_os_family]['beegfs_repo_url'] }}"
beegfs_repo_key: "{{ beegfs_distro_vars[ansible_os_family]['beegfs_repo_key'] }}"
beegfs_repo_file: "{{ beegfs_distro_vars[ansible_os_family]['beegfs_repo_file'] }}"

# Define to enable support for BeeGFS data transport over RDMA (IB, OPA, RoCE)
beegfs_rdma: true

# Default filesystem options
beegfs_filesystem_opts: "-K -d su=128k,sw=8 -l version=2,su=128k -isize=512"
beegfs_mount_opts: "uqnoenforce,gqnoenforce,noatime,nodiratime,logbufs=8,logbsize=256k,largeio,inode64,swalloc,allocsize=131072k"
beegfs_force_format: false
beegfs_fstype: "xfs"

# Storage server options
beegfs_oss_path_prefix: "/data/beegfs/beegfs_oss"
beegfs_oss: {}
# yamllint disable rule:line-length
beegfs_oss_tunable: "{{ beegfs_oss | dict2items | selectattr('value.devices', 'defined') | map(attribute='value.devices') | flatten | map('relpath', '/dev/') | list }}"

# Management options
beegfs_mgmt_path: "/data/beegfs/beegfs_mgmtd"
beegfs_mgmt_host:  # Example: "{{ groups['cluster_beegfs_mgmt'] | first }}"

# Metadata storage options
beegfs_meta_path: "/data/beegfs/beegfs_meta"
beegfs_meta_dev:  # /dev/sdb
beegfs_meta_fstype:  # Example: "ext4"
beegfs_meta_filesystem_opts: "-i 2048 -I 512 -J size=400 -O dir_index,filetype"
beegfs_meta_mount_opts: "noatime,nodiratime,nobarrier,auto"

# Client mount configs
beegfs_client: []
# Each item in the beegfs_client list should look like this:
# - path: "/mnt/beegfs" # If there are multiple clients, use different path for each client.
#   port: 8004 # If there are multiple clients, use different port for each client.
#   mgmt_host: # Use this to override the default beegfs_mgmt_host in cases there are multiple clients.

# Should the package manager use the `present` or `latest` flag for
# BeeGFS? This is useful for upgrading.
beegfs_update: false
beegfs_package_action: "{{ 'latest' if beegfs_update | bool else 'present' }}"


beegfs_enable_quota: false

beegfs_client_scope_config: true

beegfs_node_num_id:

beegfs_mon_db_hostname:

beegfs_mon_db_database:

beegfs_mon_db_port:

beegfs_oss_max_sectors_kb: 256

beegfs_meta_max_sectors_kb: 256

# Set to a non-empty string to enable authentication
beegfs_auth_secret:

# Disable TLS authentication
beegfs_disable_tls: false

# Tunings
# tuneNumWorkers settings for meta server
# 100 - 200 computes = 64. Large cluster 128
# https://doc.beegfs.io/latest/advanced_topics/metadata_tuning.html#worker-threads
beegfs_meta_tune_num_workers:

# tuneNumWorkers settings for storage server
# https://doc.beegfs.io/latest/advanced_topics/storage_tuning.html#worker-threads
beegfs_oss_tune_num_workers:

# tuneNumWorkers settings for meta server
beegfs_meta_tune_target_chooser: randomized

beegfs_conn_rdma_buf_num:

beegfs_conn_rdma_buf_size:

# Number of connections between nodes
# https://doc.beegfs.io/latest/advanced_topics/client_tuning.html#parallel-network-requests
# On compute nodes = number of cores. On login nodes more than cores to improvve responsiveness
beegfs_conn_meta_max_internode_num:
beegfs_conn_oss_max_internode_num:
beegfs_conn_client_max_internode_num:


beegfs_nvfs_include_path:
beegfs_nvidia_include_path:
beegfs_disable_nvfs_detection: false

# Workaround for https://github.com/ThinkParQ/beegfs/issues/123: on kernels that restrict
# symbol_get() to GPL-exported symbols, GPUDirect Storage (GDS) is reported as "Unsupported"
# because the BeeGFS client module exports its nvfs registration hooks with EXPORT_SYMBOL
# instead of EXPORT_SYMBOL_GPL. Fixed upstream in BeeGFS >= 8.5. Only takes effect when GDS/NVFS
# support is being built (beegfs_nvfs_include_path is set). Requires unmounting and reloading the
# beegfs module (or a reboot) to take effect if the module was already loaded. Enabled by default
# since it is a no-op unless GDS/NVFS support is being built.
beegfs_nvfs_gds_export_symbol_workaround: true
