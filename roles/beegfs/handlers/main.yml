---
- name: Restart BeeGFS mgmt service
  ansible.builtin.service:
    name: beegfs-mgmtd
    daemon_reload: true
    state: restarted
  become: true
  when: beegfs_enable.mgmt | default(false) | bool

- name: Restart BeeGFS meta service
  ansible.builtin.service:
    name: beegfs-meta
    daemon_reload: true
    state: restarted
  become: true
  when: beegfs_enable.meta | default(false) | bool

- name: Restart BeeGFS storage service
  ansible.builtin.service:
    name: "beegfs-storage@{{ item.key }}"
    daemon_reload: true
    state: restarted
  become: true
  loop: "{{ beegfs_oss | dict2items }}"
  when: beegfs_enable.oss | default(false) | bool

- name: Restart BeeGFS mon service
  ansible.builtin.service:
    name: beegfs-mon
    daemon_reload: true
    state: restarted
  become: true
  when: beegfs_enable.mon | default(false) | bool

- name: Restart BeeGFS tuning service
  ansible.builtin.service:
    name: beegfs-oss-tuning
    daemon_reload: true
    state: restarted
  become: true

- name: Rebuild BeeGFS client DKMS module
  become: true
  ansible.builtin.command:
    cmd: >-
      dkms build -m {{ beegfs_client_dkms_name }} -v {{ beegfs_client_dkms_version }}
      -k {{ ansible_kernel }} --force
  changed_when: true

- name: Reinstall BeeGFS client DKMS module
  become: true
  ansible.builtin.command:
    cmd: >-
      dkms install -m {{ beegfs_client_dkms_name }} -v {{ beegfs_client_dkms_version }}
      -k {{ ansible_kernel }} --force
  changed_when: true

- name: Warn that a module reload is required to apply the GDS workaround
  ansible.builtin.debug:
    msg: >-
      The BeeGFS client DKMS module was rebuilt with the GDS EXPORT_SYMBOL_GPL workaround
      (https://github.com/ThinkParQ/beegfs/issues/123). If the beegfs module is already loaded,
      unmount all BeeGFS filesystems and reload the module (or reboot) for the change to take
      effect.
...
