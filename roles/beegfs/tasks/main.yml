---
# Both imports below must run before "Determine mount paths and labels for
# OSS" further down, since that task's subelements('value.devices') filter
# requires every beegfs_oss entry to already have a `devices` list - entries
# that rely on numa_zone auto-discovery don't have one until oss_discovery.yml
# runs. Meta must resolve first, since OSS device discovery excludes whatever
# beegfs_meta_dev resolves to from its candidate pool.
- name: Resolve the metadata device (label-first, else NUMA/name discovery)
  ansible.builtin.import_tasks: resolve_meta_device.yml
  when: beegfs_enable.meta | default(false) | bool
  tags: always

- name: Discover devices/interfaces for beegfs_oss entries that don't specify them
  ansible.builtin.import_tasks: oss_discovery.yml
  when: beegfs_enable.oss | default(false) | bool
  tags: always

- name: Calculate and store BeeGFS node number
  ansible.builtin.set_fact:
    beegfs_node_num_id: "{{ (beegfs_node_num_id | int) * (beegfs_target_id_multiplier | int) | int }}"
  tags: always

- name: Determine storage ids
  vars:
    oss_storage_id: "{{ (beegfs_node_num_id | int) + (ix + 1) * beegfs_target_id_multiplier / 10 }}"
  ansible.builtin.set_fact:
    beegfs_oss_id_map: "{{ beegfs_oss_id_map | default({}) | combine({item.key: oss_storage_id | int}) }}"
  loop: "{{ beegfs_oss | dict2items }}"
  loop_control:
    index_var: ix
  tags: always

- name: Determine mount paths and labels for OSS
  vars:
    # ix (from subelements' loop_control) is the flattened index across ALL
    # ports' devices combined, not this device's position within its own
    # port's device list - those only coincide when every earlier-processed
    # port's device count is a multiple of the current port's count. That's
    # not guaranteed: resolve_oss_port_devices.yml excludes the metadata
    # device from whichever NUMA zone it lives in, so on any host that is
    # both meta and OSS, one port's device count is one less than the
    # other's. Use this device's own local index for the label/target id;
    # oss_path can safely keep the global ix since it only needs to be
    # unique, not stable per-port.
    oss_local_ix: "{{ item.0.value.devices.index(item.1) }}"
    oss_path: "{{ beegfs_oss_path_prefix }}/oss-data-{{ ix }}"
    oss_dev_label: "ST-{{ item.0.key }}-{{ oss_local_ix }}"
    oss_target_id: "{{ beegfs_oss_id_map[item.0.key] + (oss_local_ix | int + 1) }}"
  ansible.builtin.set_fact:
    # yamllint disable rule:line-length
    beegfs_oss_labels_mount_paths: "{{ beegfs_oss_labels_mount_paths | default({}) | combine({item.1: {'oss_storage_id': beegfs_oss_id_map[item.0.key], 'oss_target_id': (oss_target_id | int), 'mount_path': oss_path, 'label': oss_dev_label}}) }}"
  loop: "{{ beegfs_oss | dict2items | subelements('value.devices') }}"
  loop_control:
    index_var: ix
  tags: always

- name: Create BeeGFS cluster
  ansible.builtin.include_tasks: create.yml
  when: beegfs_state | lower == "present"
  tags: always

- name: Destroy BeegFS cluster
  ansible.builtin.include_tasks: destroy.yml
  when: beegfs_state | lower == "absent"
  tags: always
...
