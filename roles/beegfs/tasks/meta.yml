---

- name: Create directory for BeeGFS metadata
  ansible.builtin.file:
    path: "{{ beegfs_meta_path }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true
  notify: Restart BeeGFS meta service

- name: Prepare metadata block storage
  become: true
  when:
    - beegfs_meta_dev is defined
    - beegfs_meta_dev != None
  block:
    - name: Format filesystem
      vars:
        meta_fstype: "{{ beegfs_meta_fstype | default(beegfs_fstype) }}"
      community.general.filesystem:
        dev: "{{ beegfs_meta_dev }}"
        fstype: "{{ meta_fstype }}"
        opts: "{{ beegfs_meta_filesystem_opts }} -L {{ beegfs_meta_dev_label }}"
        force: "{{ beegfs_force_format }}"
      # beegfs_meta_already_provisioned (set by resolve_meta_device.yml) means
      # beegfs_meta_dev was resolved from its existing filesystem label, i.e.
      # this disk was already formatted in a previous run - skip reformatting
      # it even though its current device name may differ from last time
      # (device names aren't stable across reboots). Undefined (a statically
      # configured beegfs_meta_dev that never went through label resolution)
      # is treated as "not provisioned", preserving prior behavior.
      when: (not (beegfs_meta_already_provisioned | default(false) | bool)) or (beegfs_force_format | bool)
      notify: Restart BeeGFS meta service

    - name: Mount filesystem
      vars:
        meta_fstype: "{{ beegfs_meta_fstype | default(beegfs_fstype) }}"
      ansible.posix.mount:
        src: "/dev/disk/by-label/{{ beegfs_meta_dev_label }}"
        path: "{{ beegfs_meta_path }}"
        fstype: "{{ meta_fstype }}"
        opts: "{{ beegfs_meta_mount_opts }}"
        state: mounted
      notify: Restart BeeGFS meta service

- name: Run metadata service setup script
  vars:
    beegfs_meta_node_id: "{{ (beegfs_node_num_id | int + 1 * beegfs_target_id_multiplier / 10) | int }}"
  ansible.builtin.command: >
    /opt/beegfs/sbin/beegfs-setup-meta -f  -p {{ beegfs_meta_path }} -m {{ beegfs_mgmt_host }}
    "-s {{ beegfs_meta_node_id | int }}"
  args:
    creates: "{{ beegfs_meta_path }}/nodeNumID"
  become: true
  notify: Restart BeeGFS meta service

- name: Specify connInterfacesFile for BeeGFS metadata server
  ansible.builtin.lineinfile:
    path: /etc/beegfs/beegfs-meta.conf
    regexp: "^connInterfacesFile"
    line: "connInterfacesFile           = /etc/beegfs/connInterfacesFile"
  become: true
  notify: Restart BeeGFS meta service

- name: Configure tunings for BeeGFS metadata server
  become: true
  ansible.builtin.lineinfile:
    path: /etc/beegfs/beegfs-meta.conf
    regexp: "^{{ item.key }}"
    line: "{{ item.key }}{{ ' ' * ([1, 30 - item.key | length] | max) }}= {{ item.value }}"
  loop: >-
    {{
      [
        {'key': 'tuneTargetChooser', 'value': beegfs_meta_tune_target_chooser},
        {'key': 'tuneNumWorkers', 'value': beegfs_meta_tune_num_workers},
        {'key': 'connMaxInternodeNum', 'value': beegfs_conn_meta_max_internode_num},
        {'key': 'tuneBindToNumaZone', 'value': beegfs_meta_tune_bind_to_numa_zone},
        {'key': 'tuneNumStreamListeners', 'value': beegfs_meta_tune_num_stream_listeners},
        {'key': 'tuneInvalWatchMaxObjects', 'value': beegfs_meta_tune_inval_watch_max_objects},
        {'key': 'tuneInvalWatchQueueSize', 'value': beegfs_meta_tune_inval_watch_queue_size},
        {'key': 'tuneUsePerUserMsgQueues', 'value': (beegfs_meta_tune_use_per_user_msg_queues | ternary('true', 'false')) if beegfs_meta_tune_use_per_user_msg_queues is not none else none},
        {'key': 'tuneUseAggressiveStreamPoll', 'value': (beegfs_meta_tune_use_aggressive_stream_poll | ternary('true', 'false')) if beegfs_meta_tune_use_aggressive_stream_poll is not none else none},
        {'key': 'sysRemoteInvalEnabled', 'value': (beegfs_meta_sys_remote_inval_enabled | ternary('true', 'false')) if beegfs_meta_sys_remote_inval_enabled is not none else none},
        {'key': 'connRestrictOutboundInterfaces', 'value': (beegfs_conn_restrict_outbound_interfaces | ternary('true', 'false')) if beegfs_conn_restrict_outbound_interfaces is not none else none},
      ] | rejectattr('value', 'none') | list
    }}
  loop_control:
    label: "{{ item.key }}"
  notify: Restart BeeGFS meta service
