---

- name: Create directory for BeeGFS metadata
  ansible.builtin.file:
    path: "{{ beegfs_meta_path }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true
  notify: Restart BeeGFS meta service

- name: Prepare metadata block storage
  become: true
  when:
    - beegfs_meta_dev is defined
    - beegfs_meta_dev != None
  block:
    - name: Format filesystem
      vars:
        meta_fstype: "{{ beegfs_meta_fstype | default(beegfs_fstype, true) }}"
      community.general.filesystem:
        dev: "{{ beegfs_meta_dev }}"
        fstype: "{{ meta_fstype }}"
        opts: "{{ beegfs_meta_filesystem_opts }} -L {{ beegfs_meta_dev_label }}"
        force: "{{ beegfs_force_format }}"
      # beegfs_meta_already_provisioned (set by resolve_meta_device.yml) means
      # beegfs_meta_dev was resolved from its existing filesystem label, i.e.
      # this disk was already formatted in a previous run - skip reformatting
      # it even though its current device name may differ from last time
      # (device names aren't stable across reboots). Undefined (a statically
      # configured beegfs_meta_dev that never went through label resolution)
      # is treated as "not provisioned", preserving prior behavior.
      when: (not (beegfs_meta_already_provisioned | default(false) | bool)) or (beegfs_force_format | bool)
      notify: Restart BeeGFS meta service

    # The mount below goes through /dev/disk/by-label, which udev only
    # creates some time after mkfs returns. Returns at once if udev is idle.
    - name: Wait for udev to create the new filesystem label
      ansible.builtin.command: udevadm settle
      changed_when: false

    - name: Mount filesystem
      vars:
        meta_fstype: "{{ beegfs_meta_fstype | default(beegfs_fstype, true) }}"
      ansible.posix.mount:
        src: "/dev/disk/by-label/{{ beegfs_meta_dev_label }}"
        path: "{{ beegfs_meta_path }}"
        fstype: "{{ meta_fstype }}"
        opts: "{{ beegfs_meta_mount_opts }}"
        state: mounted
      notify: Restart BeeGFS meta service

- name: Run metadata service setup script
  vars:
    beegfs_meta_node_id: "{{ (beegfs_node_num_id | int + 1 * beegfs_target_id_multiplier / 10) | int }}"
  ansible.builtin.command: >
    /opt/beegfs/sbin/beegfs-setup-meta -f  -p {{ beegfs_meta_path }} -m {{ beegfs_mgmt_host }}
    "-s {{ beegfs_meta_node_id | int }}"
  args:
    creates: "{{ beegfs_meta_path }}/nodeNumID"
  become: true
  notify: Restart BeeGFS meta service

- name: Default the metadata service's interfaces to beegfs_meta_interfaces or beegfs_interfaces
  ansible.builtin.set_fact:
    beegfs_meta_resolved_interfaces: "{{ beegfs_meta_interfaces | default([], true) or beegfs_interfaces }}"
  tags: interfaces

# Mirrors the per-OSS NIC ordering in oss_discovery.yml: without it the meta
# service would prefer whichever NIC happens to come first in
# beegfs_interfaces, even if it sits on the other NUMA zone than the one
# tuneBindToNumaZone pins the service to.
- name: Order the metadata service's interfaces NUMA-local NIC(s) first
  when:
    - beegfs_meta_interfaces | default([], true) | length == 0
    - beegfs_meta_tune_bind_to_numa_zone is not none
    - beegfs_meta_tune_bind_to_numa_zone | string | length > 0
    - beegfs_interfaces | length > 0
  tags: interfaces
  block:
    - name: Map each configured BeeGFS interface to its NUMA node
      ansible.builtin.import_tasks: nic_numa_map.yml

    # beegfs_numa_nic_fallback decides whether the non-local NIC(s) follow as
    # an HA fallback or are left out, so meta only ever uses local NIC(s).
    - name: Put the NIC(s) local to the metadata service's NUMA zone first
      ansible.builtin.set_fact:
        beegfs_meta_resolved_interfaces: >-
          {{ local_nics + ((beegfs_interfaces | reject('in', local_nics) | list) if beegfs_numa_nic_fallback | bool else []) }}
      vars:
        local_nic_names: >-
          {{
            beegfs_nic_numa_map
            | dict2items(key_name='nic', value_name='numa')
            | selectattr('numa', 'equalto', beegfs_meta_tune_bind_to_numa_zone | int)
            | map(attribute='nic') | list
          }}
        local_nics: "{{ beegfs_interfaces | select('in', local_nic_names) | list }}"

    # An empty connInterfacesFile would let BeeGFS use every interface, the
    # opposite of what beegfs_numa_nic_fallback=false asks for.
    - name: Fail if no configured NIC is local to the metadata service's NUMA zone while fallback is disabled
      ansible.builtin.fail:
        msg: >-
          None of beegfs_interfaces {{ beegfs_interfaces }} is attached to NUMA
          zone {{ beegfs_meta_tune_bind_to_numa_zone }}, which the metadata
          service is bound to, and beegfs_numa_nic_fallback is false - add a
          local NIC, set beegfs_meta_interfaces, or enable the fallback.
      when: beegfs_meta_resolved_interfaces | length == 0

# With beegfs_numa_nic_fallback the remaining NICs are an HA fallback, so only
# the preferred one must be local; without it every NIC must be.
- name: Validate metadata NIC(s) are attached to the configured NUMA zone
  when:
    - beegfs_meta_tune_bind_to_numa_zone is not none
    - beegfs_meta_tune_bind_to_numa_zone | string | length > 0
  tags: interfaces
  block:
    - name: Reset the metadata NIC(s) to validate
      ansible.builtin.set_fact:
        beegfs_meta_numa_checks: []

    - name: Collect the metadata NIC(s) to validate
      ansible.builtin.set_fact:
        beegfs_meta_numa_checks: >-
          {{
            beegfs_meta_numa_checks + [{
              'path': '/sys/class/net/' ~ item ~ '/device/numa_node',
              'label': ('Preferred NIC' if beegfs_numa_nic_fallback | bool else 'NIC') ~ ' ' ~ item,
              'zone': beegfs_meta_tune_bind_to_numa_zone,
              'service': 'the BeeGFS metadata service',
            }]
          }}
      loop: "{{ beegfs_meta_resolved_interfaces[:1] if beegfs_numa_nic_fallback | bool else beegfs_meta_resolved_interfaces }}"

    - name: Validate the collected metadata NIC(s)
      ansible.builtin.import_tasks: numa_check.yml
      vars:
        numa_checks: "{{ beegfs_meta_numa_checks }}"

- name: Create connInterfacesFile for BeeGFS metadata server
  vars:
    beegfs_interfaces: "{{ beegfs_meta_resolved_interfaces }}"
  ansible.builtin.template:
    src: connInterfacesFile.j2
    dest: "{{ beegfs_meta_conn_interfaces_file }}"
    mode: "0644"
    owner: root
    group: root
  become: true
  tags: interfaces
  notify: Restart BeeGFS meta service

- name: Specify connInterfacesFile for BeeGFS metadata server
  ansible.builtin.lineinfile:
    path: /etc/beegfs/beegfs-meta.conf
    regexp: "^connInterfacesFile"
    line: "connInterfacesFile           = {{ beegfs_meta_conn_interfaces_file }}"
  become: true
  tags: interfaces
  notify: Restart BeeGFS meta service

- name: Configure tunings for BeeGFS metadata server
  become: true
  tags: [meta_config, config]
  ansible.builtin.lineinfile:
    path: /etc/beegfs/beegfs-meta.conf
    regexp: "^{{ item.key }}"
    line: "{{ item.key }}{{ ' ' * ([1, 30 - item.key | length] | max) }}= {{ item.value }}"
  loop: >-
    {{
      [
        {'key': 'tuneTargetChooser', 'value': beegfs_meta_tune_target_chooser},
        {'key': 'tuneNumWorkers', 'value': beegfs_meta_tune_num_workers},
        {'key': 'tuneNumCommSlaves', 'value': beegfs_meta_tune_num_comm_slaves},
        {'key': 'tuneDefaultChunkSize', 'value': beegfs_meta_tune_default_chunk_size},
        {'key': 'tuneDefaultNumStripeTargets', 'value': beegfs_meta_tune_default_num_stripe_targets},
        {'key': 'connMaxInternodeNum', 'value': beegfs_conn_meta_max_internode_num},
        {'key': 'tuneBindToNumaZone', 'value': beegfs_meta_tune_bind_to_numa_zone},
        {'key': 'tuneNumStreamListeners', 'value': beegfs_meta_tune_num_stream_listeners},
        {'key': 'tuneInvalWatchMaxObjects', 'value': beegfs_meta_tune_inval_watch_max_objects},
        {'key': 'tuneInvalWatchQueueSize', 'value': beegfs_meta_tune_inval_watch_queue_size},
        {'key': 'tuneUsePerUserMsgQueues',
         'value': (beegfs_meta_tune_use_per_user_msg_queues | ternary('true', 'false'))
                  if beegfs_meta_tune_use_per_user_msg_queues is not none else none},
        {'key': 'tuneUseAggressiveStreamPoll',
         'value': (beegfs_meta_tune_use_aggressive_stream_poll | ternary('true', 'false'))
                  if beegfs_meta_tune_use_aggressive_stream_poll is not none else none},
        {'key': 'sysRemoteInvalEnabled',
         'value': (beegfs_meta_sys_remote_inval_enabled | ternary('true', 'false'))
                  if beegfs_meta_sys_remote_inval_enabled is not none else none},
        {'key': 'connRestrictOutboundInterfaces',
         'value': (beegfs_conn_restrict_outbound_interfaces | ternary('true', 'false'))
                  if beegfs_conn_restrict_outbound_interfaces is not none else none},
        {'key': 'connRDMATypeOfService', 'value': beegfs_conn_rdma_type_of_service},
      ] | rejectattr('value', 'none') | list
    }}
  loop_control:
    label: "{{ item.key }}"
  notify: Restart BeeGFS meta service
