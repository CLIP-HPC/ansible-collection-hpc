---

- name: Deploy BeeGFS license file
  ansible.builtin.copy:
    content: "{{ beegfs_license_content }}"
    dest: /etc/beegfs/license.pem
    mode: "0600"
    owner: root
    group: root
  become: true
  no_log: true
  when: beegfs_license_content | default('', true) | length > 0
  notify: Reload BeeGFS license

- name: Disable TLS authentication (Development)
  ansible.builtin.lineinfile:
    path: /etc/beegfs/beegfs-mgmtd.toml
    insertafter: "^# tls-disable ="
    regexp: "^tls-disable ="
    line: "tls-disable = {{ beegfs_disable_tls | lower }}"
  become: true
  notify: Restart BeeGFS mgmt service

- name: Adapt database file location
  ansible.builtin.lineinfile:
    path: /etc/beegfs/beegfs-mgmtd.toml
    regexp: "^db-file ="
    line: "db-file = '{{ beegfs_mgmt_path }}/mgmtd.sqlite'"
    insertafter: "^# db-file ="
  become: true
  notify: Restart BeeGFS mgmt service

# A setting that is off is removed, leaving the package default (off), so
# hosts without quota keep their config unchanged.
- name: Configure quota in the management service
  ansible.builtin.lineinfile:
    path: /etc/beegfs/beegfs-mgmtd.toml
    regexp: "^{{ item.key }} ="
    line: "{{ item.key }} = {{ item.value }}"
    insertafter: "^# {{ item.key }} ="
    state: "{{ 'present' if item.value else 'absent' }}"
  loop:
    - key: quota-enable
      value: "{{ 'true' if beegfs_enable_quota | bool else '' }}"
    - key: quota-enforce
      value: "{{ 'true' if beegfs_enforce_quota | bool else '' }}"
    - key: quota-update-interval
      value: "{{ beegfs_quota_update_interval | string | to_json if beegfs_quota_update_interval else '' }}"
  loop_control:
    label: "{{ item.key }}"
  become: true
  tags: [mgmt_config, config]
  notify: Restart BeeGFS mgmt service

- name: Run management service setup script
  ansible.builtin.command: "/opt/beegfs/sbin/beegfs-mgmtd --init"
  args:
    creates: "{{ beegfs_mgmt_path }}/mgmtd.sqlite"
  become: true
  notify: Restart BeeGFS mgmt service
