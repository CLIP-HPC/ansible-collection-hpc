---
- name: Create storage config dirs
  ansible.builtin.file:
    path: "/etc/beegfs/{{ oss_port }}.d/"
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Validate configured OSS devices are attached to the configured NUMA zone
  ansible.builtin.include_tasks: numa_check.yml
  vars:
    # /sys/block/<nvmeXnY>/device (and its /sys/class/block alias) is a
    # symlink to the NVMe *controller* node (nvmeX), not to its PCI
    # function, so numa_node isn't there - it's one more "device" hop up, at
    # the controller's own device symlink.
    oss_dev_basename: "{{ oss_dev | basename }}"
    numa_check_path: >-
      {{
        ('/sys/class/nvme/' + (oss_dev_basename | regex_replace('n[0-9]+$', '')) + '/device/numa_node')
        if (oss_dev_basename is match('^nvme[0-9]+n[0-9]+$'))
        else ('/sys/class/block/' + oss_dev_basename + '/device/numa_node')
      }}
    numa_check_label: "OSS device {{ oss_dev }}"
    numa_check_zone: "{{ oss_tune_bind_to_numa_zone }}"
  loop: "{{ oss_devices }}"
  loop_control:
    loop_var: oss_dev
  when:
    - oss_tune_bind_to_numa_zone is defined
    - oss_tune_bind_to_numa_zone is not none

- name: Validate preferred OSS NIC is attached to the configured NUMA zone
  ansible.builtin.include_tasks: numa_check.yml
  vars:
    numa_check_path: "/sys/class/net/{{ interfaces | first }}/device/numa_node"
    numa_check_label: "Preferred NIC {{ interfaces | first }}"
    numa_check_zone: "{{ oss_tune_bind_to_numa_zone }}"
  when:
    - oss_tune_bind_to_numa_zone is defined
    - oss_tune_bind_to_numa_zone is not none
    - interfaces | default([]) | length > 0

- name: Create connInterfacesFile
  vars:
    beegfs_interfaces: "{{ interfaces }}"
  ansible.builtin.template:
    src: connInterfacesFile.j2
    dest: /etc/beegfs/{{ oss_port }}.d/connInterfacesFile
    mode: "0644"
    owner: root
    group: root
  become: true

- name: Add template beegfs-storage conf
  ansible.builtin.copy:
    src: "/etc/beegfs/beegfs-storage.conf"
    dest: "/etc/beegfs/{{ oss_port }}.d/beegfs-storage.conf"
    remote_src: true
    force: false
    mode: "0644"
    owner: root
    group: root
  become: true
  notify: Restart BeeGFS storage service

- name: Set Storage Port
  ansible.builtin.lineinfile:
    path: "/etc/beegfs/{{ oss_port }}.d/beegfs-storage.conf"
    regexp: '^connStoragePort'
    line: "connStoragePort = {{ oss_port }}"
  become: true
  notify: Restart BeeGFS storage service

- name: Specify connInterfacesFile
  ansible.builtin.lineinfile:
    path: "/etc/beegfs/{{ oss_port }}.d/beegfs-storage.conf"
    regexp: "^connInterfacesFile"
    line: "connInterfacesFile           = /etc/beegfs/{{ oss_port }}.d/connInterfacesFile"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart BeeGFS storage service

- name: Prepare storage devices
  ansible.builtin.include_tasks: fs.yml
  vars:
    oss_path: "{{ beegfs_oss_labels_mount_paths[oss_dev].mount_path }}"
    oss_dev_label: "{{ beegfs_oss_labels_mount_paths[oss_dev].label }}"
    oss_dev_already_provisioned: "{{ beegfs_oss_device_provisioned[oss_dev] | default(false) }}"
  tags: ["beegfs", "oss", "fs"]
  args:
    apply:
      tags: ["beegfs", "oss", "fs"]
  loop: "{{ oss_devices }}"
  loop_control:
    loop_var: oss_dev
    index_var: oss_idx


- name: Run storage service setup script
  vars:
    oss_path: "{{ beegfs_oss_labels_mount_paths[oss_dev].mount_path }}"
    oss_replace: "{{ '-r' if oss_idx == 0 else '' }}"
  loop: "{{ oss_devices }}"
  loop_control:
    index_var: oss_idx
    loop_var: oss_dev
  ansible.builtin.command: |
    /opt/beegfs/sbin/beegfs-setup-storage -f \
    -p {{ oss_path }}  \
    {{ oss_replace }} \
    -m {{ beegfs_mgmt_host }} \
    -c /etc/beegfs/{{ oss_port }}.d/beegfs-storage.conf \
    -s {{ beegfs_oss_labels_mount_paths[oss_dev].oss_storage_id | int }} \
    -i {{ beegfs_oss_labels_mount_paths[oss_dev].oss_target_id | int }} \
  args:
    creates: "{{ oss_path }}/targetNumID"
  become: true
  notify: Restart BeeGFS storage service


- name: Configure tunings for BeeGFS storage server
  become: true
  ansible.builtin.lineinfile:
    path: /etc/beegfs/{{ oss_port }}.d/beegfs-storage.conf
    regexp: "^{{ item.key }}"
    line: "{{ item.key }}{{ ' ' * ([1, 30 - item.key | length] | max) }}= {{ item.value }}"
  loop: >-
    {{
      [
        {'key': 'tuneNumWorkers', 'value': beegfs_oss_tune_num_workers},
        {'key': 'connMaxInternodeNum', 'value': beegfs_conn_oss_max_internode_num},
        {'key': 'tuneFileReadSize', 'value': beegfs_oss_tune_file_read_size},
        {'key': 'tuneFileWriteSize', 'value': beegfs_oss_tune_file_write_size},
        {'key': 'tuneFileReadAheadSize', 'value': beegfs_oss_tune_file_read_ahead_size},
        {'key': 'tuneFileReadAheadTriggerSize', 'value': beegfs_oss_tune_file_read_ahead_trigger_size},
        {'key': 'tuneFileWriteSyncSize', 'value': beegfs_oss_tune_file_write_sync_size},
        {'key': 'tuneNumStreamListeners', 'value': beegfs_oss_tune_num_stream_listeners},
        {'key': 'tuneWorkerBufSize', 'value': beegfs_oss_tune_worker_buf_size},
        {'key': 'tuneUsePerTargetWorkers',
         'value': (beegfs_oss_tune_use_per_target_workers | ternary('true', 'false'))
                  if beegfs_oss_tune_use_per_target_workers is not none else none},
        {'key': 'tuneUsePerUserMsgQueues',
         'value': (beegfs_oss_tune_use_per_user_msg_queues | ternary('true', 'false'))
                  if beegfs_oss_tune_use_per_user_msg_queues is not none else none},
        {'key': 'tuneUseAggressiveStreamPoll',
         'value': (beegfs_oss_tune_use_aggressive_stream_poll | ternary('true', 'false'))
                  if beegfs_oss_tune_use_aggressive_stream_poll is not none else none},
        {'key': 'connRestrictOutboundInterfaces',
         'value': (beegfs_conn_restrict_outbound_interfaces | ternary('true', 'false'))
                  if beegfs_conn_restrict_outbound_interfaces is not none else none},
        {'key': 'connRDMATypeOfService', 'value': beegfs_conn_rdma_type_of_service},
      ] | rejectattr('value', 'none') | list
    }}
  loop_control:
    label: "{{ item.key }}"
  notify: Restart BeeGFS storage service

# Kept separate from the loop above: oss_tune_bind_to_numa_zone is sourced via
# `numa_zone | default(omit)` in create.yml's vars: block. When numa_zone is
# unset, that omit sentinel is NOT equivalent to Jinja "none" here - embedding
# it in a dict literal's value (as the loop above does) silently renders as an
# empty string instead of being filtered out by rejectattr('value', 'none'),
# which would blank this line instead of leaving it untouched. The explicit
# `is defined`/`is not none` checks below are the only combination that
# correctly detects both the omitted and unset cases.
- name: Configure tuneBindToNumaZone for BeeGFS storage server
  become: true
  ansible.builtin.lineinfile:
    path: /etc/beegfs/{{ oss_port }}.d/beegfs-storage.conf
    regexp: ^tuneBindToNumaZone
    line: tuneBindToNumaZone           = {{ oss_tune_bind_to_numa_zone }}
  when:
    - oss_tune_bind_to_numa_zone is defined
    - oss_tune_bind_to_numa_zone is not none
  notify: Restart BeeGFS storage service
