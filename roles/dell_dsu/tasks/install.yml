---
# The Dell DSU repositories are configured by Dell's bootstrap.cgi (see the
# post-install workaround below), so the RPM is installed straight from its URL.
- name: install | Install Dell System Update from URL
  ansible.builtin.dnf:
    name: "{{ dell_dsu_rpm_url }}"
    state: present
    disable_gpg_check: "{{ dell_dsu_rpm_disable_gpg_check }}"
  become: true
  register: dell_dsu_package_install

# Workaround for the dell-system-update %post scriptlet, which fails in the RPM
# transaction and leaves DSU without its public keys ("Shared library integrity
# check failed"). The steps below reproduce the scriptlet as Ansible tasks.
- name: install | Check whether the DSU post-install workaround already ran
  ansible.builtin.stat:
    path: "{{ dell_dsu_postinstall_marker }}"
  register: dell_dsu_postinstall_marker_stat
  when: dell_dsu_run_postinstall | bool

- name: install | Check whether running from a live ISO
  ansible.builtin.stat:
    path: /run/overlay/live
  register: dell_dsu_live_iso
  when: dell_dsu_run_postinstall | bool

- name: install | Set the DSU post-install workaround condition
  ansible.builtin.set_fact:
    _dell_dsu_run_postinstall_now: >-
      {{
        dell_dsu_run_postinstall | bool
        and not dell_dsu_live_iso.stat.exists
        and (dell_dsu_package_install is changed or not dell_dsu_postinstall_marker_stat.stat.exists)
      }}
  when: dell_dsu_run_postinstall | bool

- name: install | Post-install | Remove obsolete dsulib ld.so configuration
  ansible.builtin.file:
    path: /etc/ld.so.conf.d/dsulib.conf
    state: absent
  become: true
  register: dell_dsu_ldconf
  when: _dell_dsu_run_postinstall_now | default(false) | bool

- name: install | Post-install | Refresh the dynamic linker cache
  ansible.builtin.command: /sbin/ldconfig
  become: true
  changed_when: true
  when: _dell_dsu_run_postinstall_now | default(false) | bool

- name: install | Post-install | Make getOEMSystemId executable
  ansible.builtin.file:
    path: /opt/dell/dsu/getOEMSystemId
    mode: 'a+x'
  become: true
  when: _dell_dsu_run_postinstall_now | default(false) | bool

- name: install | Post-install | Download Dell DSU bootstrap script
  ansible.builtin.get_url:
    url: "{{ dell_dsu_bootstrap_url }}"
    dest: "{{ dell_dsu_bootstrap_dest }}"
    owner: root
    group: root
    mode: '0755'
    force: true
    timeout: 60
  become: true
  retries: 3
  delay: 5
  register: dell_dsu_bootstrap_download
  until: dell_dsu_bootstrap_download is succeeded
  when: _dell_dsu_run_postinstall_now | default(false) | bool

# The RPM scriptlet pipes "y" into the bootstrap script to answer its prompts.
- name: install | Post-install | Run Dell DSU bootstrap script
  ansible.builtin.command:
    argv: ["bash", "{{ dell_dsu_bootstrap_dest }}"]
    stdin: "{{ 'y\n' * 50 }}"
    stdin_add_newline: false
  become: true
  changed_when: true
  when: _dell_dsu_run_postinstall_now | default(false) | bool

- name: install | Post-install | Record that the workaround ran
  ansible.builtin.file:
    path: "{{ dell_dsu_postinstall_marker }}"
    state: touch
    owner: root
    group: root
    mode: '0644'
    modification_time: preserve
    access_time: preserve
  become: true
  when: _dell_dsu_run_postinstall_now | default(false) | bool
