---
# Internal variables for clip.hpc.dell_dsu - not intended to be overridden.
_dell_dsu_common_args: >-
  {{
    (['--catalog-location=' ~ dell_dsu_catalog_location] if dell_dsu_catalog_location | length > 0 else [])
    + (['--component-type=' ~ (dell_dsu_component_types | join(','))] if dell_dsu_component_types | length > 0 else [])
    + dell_dsu_extra_args
  }}
# DSU return codes 25 (partial failure) and 26 (partial failure, reboot required).
_dell_dsu_partial_return_codes: [25, 26]
# Poll attempts for the async DSU apply (job time plus margin for lost connections)
# and for waiting on an already running dsu process.
_dell_dsu_apply_poll_retries: "{{ ((dell_dsu_apply_timeout | int) // (dell_dsu_apply_poll_interval | int) + 10) | int }}"
_dell_dsu_wait_retries: "{{ ((dell_dsu_wait_timeout | int) // (dell_dsu_apply_poll_interval | int)) | int }}"
