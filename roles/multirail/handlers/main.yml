---
# handlers file for clip.hpc.multirail
# Reapplying a connection without changes is a no-op, so both interfaces are reapplied together
- name: Reapply multirail interfaces
  ansible.builtin.command: "/usr/bin/nmcli device reapply {{ item }}"
  become: true
  changed_when: true
  loop: "{{ multirail_interfaces }}"
