---
- name: configure | Ensure rdma_exporter service is enabled/started
  ansible.builtin.systemd:
    name: rdma_exporter
    enabled: "{{ rdma_exporter_service_enabled }}"
    state: "{{ rdma_exporter_service_state }}"
    daemon_reload: true
  become: true
  # In check mode a new or changed unit isn't written yet
  when: not (ansible_check_mode and rdma_exporter_unit_file is changed)
