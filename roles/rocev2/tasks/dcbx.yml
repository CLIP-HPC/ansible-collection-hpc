---
# The discovery tasks only read state (mst start only loads the MST kernel modules that
# mst status needs to list devices), so they also run in check mode to report the firmware
# changes the role would make.
- name: dcbx | Start mst
  become: true
  ansible.builtin.command: "/usr/bin/mst start"
  changed_when: false
  failed_when: false
  check_mode: false

- name: dcbx | Retrieve MLX device
  become: true
  ansible.builtin.command: "/usr/bin/mst status"
  register: rocev2_mst_status
  changed_when: false
  check_mode: false

- name: dcbx | Store MLX devies
  ansible.builtin.set_fact:
    rocev2_mlx_devices: '{{ rocev2_mst_status.stdout | regex_findall("^\s*(/dev/mst/\S+)", multiline=True) }}'

- name: dcbx | Retrieve MLX firmware settings
  become: true
  ansible.builtin.command: "/usr/bin/mlxconfig -d {{ item }} q"
  loop: "{{ rocev2_mlx_devices }}"
  register: rocev2_mlx_current_settings
  changed_when: false
  failed_when: false
  check_mode: false

- name: dcbx | Report MLX devices without configurable firmware
  ansible.builtin.debug:
    msg: >-
      Skipping {{ item.item }}: mlxconfig query failed (rc={{ item.rc }}: {{ item.stdout | trim }}),
      likely a non-NIC device (e.g. a GPU-attached chip) rather than a discrete NIC.
  loop: "{{ rocev2_mlx_current_settings.results | rejectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: dcbx | Store MLX devices with configurable firmware
  ansible.builtin.set_fact:
    rocev2_mlx_configurable_settings: "{{ rocev2_mlx_current_settings.results | selectattr('rc', 'equalto', 0) | list }}"

- name: dcbx | Fail if no MLX devices support configuration
  ansible.builtin.fail:
    msg: >-
      None of the {{ rocev2_mlx_devices | length }} MST device(s) found support mlxconfig queries.
      Expected at least one discrete NIC to be configurable.
  when: rocev2_mlx_configurable_settings | length == 0

- name: dcbx | Store Current DCBX settings
  ansible.builtin.set_fact:
    rocev2_lldp_nb_dcbx_ports: >-
      {{ rocev2_lldp_nb_dcbx_ports | default({}) | combine({
        item.item: item.stdout
        | regex_findall('(LLDP_NB_DCBX_P[1-2])\s+(\w*)', '\1', '\2')
        | selectattr('1', 'ne', 'True')
        | map(attribute='0')
        | list
      }) }}
    rocev2_lldp_nb_rx_mode_ports: >-
      {{ rocev2_lldp_nb_rx_mode_ports | default({}) | combine({
        item.item: item.stdout
        | regex_findall('(LLDP_NB_RX_MODE_P[1-2])\s+(\w*)', '\1', '\2')
        | selectattr('1', 'ne', 'ALL')
        | map(attribute='0')
        | list
      }) }}
    rocev2_lldp_nb_tx_mode_ports: >-
      {{ rocev2_lldp_nb_tx_mode_ports | default({}) | combine({
        item.item: item.stdout
        | regex_findall('(LLDP_NB_TX_MODE_P[1-2])\s+(\w*)', '\1', '\2')
        | selectattr('1', 'ne', 'ALL')
        | map(attribute='0')
        | list
      }) }}
  loop: "{{ rocev2_mlx_configurable_settings }}"
  loop_control:
    label: "{{ item.item }}"

# Built from the query, which also runs in check mode, so a dry run reports the settings that
# would change and the reboot they need, although the mlxconfig set commands below are skipped.
- name: dcbx | Reset MLX firmware settings to change
  ansible.builtin.set_fact:
    rocev2_mlx_pending_settings: []

- name: dcbx | Store MLX firmware settings to change
  ansible.builtin.set_fact:
    rocev2_mlx_pending_settings: "{{ rocev2_mlx_pending_settings + [item.0.0.key ~ ' ' ~ item.0.1 ~ '=' ~ item.1] }}"
  loop: >-
    {{
      (rocev2_lldp_nb_dcbx_ports | dict2items | subelements('value', skip_missing=True) | product([1]) | list)
      + (rocev2_lldp_nb_rx_mode_ports | dict2items | subelements('value', skip_missing=True) | product([2]) | list)
      + (rocev2_lldp_nb_tx_mode_ports | dict2items | subelements('value', skip_missing=True) | product([2]) | list)
    }}
  loop_control:
    label: "{{ item.0.0.key }} / {{ item.0.1 }}={{ item.1 }}"

- name: dcbx | Enable LLDP DCBX on all ports
  become: true
  ansible.builtin.command: >
    /usr/bin/mlxconfig -d {{ pair.0.key }} -y s
    {{ pair.1 }}=1
  loop: "{{ rocev2_lldp_nb_dcbx_ports | dict2items | subelements('value', skip_missing=True) }}"
  loop_control:
    loop_var: pair
    label: "{{ pair.0.key }} / {{ pair.1 }} "
  changed_when: true
  notify: Reboot server

- name: dcbx | Enable LLDP DCBX RX on all ports
  become: true
  ansible.builtin.command: >
    /usr/bin/mlxconfig -d {{ pair.0.key }} -y s
    {{ pair.1 }}=2
  loop: "{{ rocev2_lldp_nb_rx_mode_ports | dict2items | subelements('value', skip_missing=True) }}"
  loop_control:
    loop_var: pair
    label: "{{ pair.0.key }} / {{ pair.1 }} "
  changed_when: true
  notify: Reboot server

- name: dcbx | Enable LLDP DCBX TX on all ports
  become: true
  ansible.builtin.command: >
    /usr/bin/mlxconfig -d {{ pair.0.key }} -y s
    {{ pair.1 }}=2
  loop: "{{ rocev2_lldp_nb_tx_mode_ports | dict2items | subelements('value', skip_missing=True) }}"
  loop_control:
    loop_var: pair
    label: "{{ pair.0.key }} / {{ pair.1 }} "
  changed_when: true
  notify: Reboot server

# mlxconfig only changes the configuration for the next boot: the settings take effect after a reboot.
- name: dcbx | Record that the MLX firmware settings need a reboot
  ansible.builtin.set_fact:
    rocev2_reboot_required: true
  when: rocev2_mlx_pending_settings | length > 0

- name: dcbx | Report MLX firmware settings that need a reboot
  ansible.builtin.debug:
    msg: >-
      {{ 'Would change' if ansible_check_mode else 'Changed' }} MLX firmware settings that take
      effect after a reboot: {{ rocev2_mlx_pending_settings | join(', ') }}.
      {{
        ('The host ' ~ ('would be' if ansible_check_mode else 'is') ~ ' rebooted now (rocev2_reboot is true).')
        if rocev2_reboot | bool else
        'rocev2_reboot is false, so the host is not rebooted: reboot it to apply them (see /run/reboot-required).'
      }}
  when: rocev2_reboot_required | bool

- name: dcbx | Mark that a reboot is required
  become: true
  ansible.builtin.lineinfile:
    path: /run/reboot-required
    line: "clip.hpc.rocev2: MLX firmware settings changed"
    create: true
    owner: root
    group: root
    mode: "0644"
  when:
    - rocev2_reboot_required | bool
    - not rocev2_reboot | bool

# Runs the Reboot server handler, which only reboots with rocev2_reboot, before the QoS service
# is started below.
- name: dcbx | Flush handlers
  ansible.builtin.meta: flush_handlers
