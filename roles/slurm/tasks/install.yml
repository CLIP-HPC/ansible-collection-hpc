---
- name: install | Create SLURM User and Group
  tags: install
  ansible.builtin.include_tasks: users.yml

- name: install | Workaround for libjwt issue on RHEL10 (only needed for slurm REST API)
  when: ansible_distribution_major_version == '10'
  tags: install
  block:
    - name: install | Install python3-dnf-plugin-versionlock
      ansible.builtin.package:
        name: python3-dnf-plugin-versionlock
        state: present

    - name: install | Pin libjwt < 2.x.x (workaround for RHEL10 Slurm REST issue)
      community.general.dnf_versionlock:
        name:
          - libjwt-0:1*
          - libjwt-devel-0:1*

- name: install | Build host-specific list of required slurm packages
  tags: install
  ansible.builtin.set_fact:
    slurm_pkglist: "{{ (slurm_pkglist | default([])) + (item.value | default([])) }}"
  loop: "{{ slurm_slurm_packages | dict2items }}"
  when: slurm_enable is defined and slurm_enable.get(item.key, false) | bool

- name: install | Install required slurm packages
  tags: install
  ansible.builtin.dnf:
    name: "{{ slurm_pkglist | reject('eq', '') }}"
    install_weak_deps: false # avoids getting recommended packages
  when: slurm_pkglist is defined and slurm_pkglist | length > 0

- name: install | Install other packages
  tags: install
  ansible.builtin.dnf:
    name: "{{ slurm_packages }}"
