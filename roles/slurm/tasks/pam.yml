- name: Stop, disable, mask systemd-logind
  ansible.builtin.systemd:
    name: systemd-logind
    state: stopped
    enabled: false
    masked: true

- name: pam | Fix /etc/security/access.conf
  tags:
    - pam
  ansible.builtin.blockinfile:
    path: /etc/security/access.conf
    marker: "# {mark} ANSIBLE MANAGED BLOCK"
    insertafter: EOF
    block: |
      {% for item in slurm_ssh_access | default([]) %}+:{{ item }}:ALL
      {% endfor %}
      {% if ansible_user is defined %}+:{{ ansible_user }}:ALL
      {% endif %}
      -:ALL:ALL
    backup: true
