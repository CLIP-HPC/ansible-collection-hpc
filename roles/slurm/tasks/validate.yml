# Playbook to validate slurm setup
---
- name: validate | Check required variables
  tags:
    - always
    - validate
  ansible.builtin.assert:
    that:
      - slurm_cluster_name is defined
      - slurm_cluster_name != ''
      - slurm_munge_key is defined
      - slurm_munge_key != ''
      - not (slurm_rest_enable | bool) or (slurm_rest_jwt_key is defined and slurm_rest_jwt_key and slurm_rest_jwt_key != '')
    fail_msg: slurm role variables not correctly defined, see detail above

- name: validate | Check lua JobSubmitPlugins has script configured
  tags:
    - always
    - validate
  ansible.builtin.assert:
    that:
      - "'lua' not in _slurm_job_submit_plugins or slurm_job_submit_script | default('', true) | length > 0"
    fail_msg: >-
      JobSubmitPlugins includes 'lua' but slurm_job_submit_script is not set.
      Set slurm_job_submit_script to a template path or source file path for /etc/slurm/job_submit.lua.
  vars:
    _slurm_job_submit_plugins: "{{ (slurm_default_config | combine(slurm_config)).get('JobSubmitPlugins', []) }}"
  delegate_to: localhost
  run_once: true

- name: validate | Check no host appears in more than one nodegroup
  tags:
    - always
    - validate
  ansible.builtin.assert:
    that: "{{ _slurm_check_hosts.values() | select('greaterthan', 1) | length == 0 }}"
    fail_msg: |
      Some hosts appear more than once in inventory groups {{ _slurm_node_inventory_groups | join(', ') }}:
      {{ _slurm_check_hosts | dict2items | rejectattr('value', 'equalto', 1) | items2dict | to_nice_yaml }}
  vars:
    _slurm_node_inventory_groups: "{{ slurm_nodegroups | map(attribute='name') | map('regex_replace', '^', slurm_cluster_name ~ '_') }}"
    _slurm_check_hosts: "{{ groups | dict2items | list | selectattr('key', 'in', _slurm_node_inventory_groups) | map(attribute='value') | flatten | community.general.counter }}" # noqa: yaml[line-length]
  delegate_to: localhost
  run_once: true

- name: validate | Validate slurm_nodegroups
  tags:
    - always
    - validate
  ansible.utils.validate:
    criteria: "{{ lookup('file', 'nodegroup.schema') }}"
    engine: 'ansible.utils.jsonschema'
    data: "{{ item }}"
  vars:
    ansible_jsonschema_draft: '2020-12'
  delegate_to: localhost
  loop: "{{ slurm_nodegroups }}"
  run_once: true

- name: validate | Check no node is in more than one exclusive partition slice
  tags:
    - always
    - validate
  ansible.builtin.assert:
    that: _slurm_multi_claimed | length == 0
    fail_msg: |
      Some nodes are listed in the nodes of more than one exclusive partition (set exclusive: false on the others):
      {{ _slurm_multi_claimed | to_nice_yaml }}
  vars:
    _slurm_multi_claimed: "{{ slurm_partitions | clip.hpc.slurm_slices | dict2items | selectattr('value.exclusive.1', 'defined') | items2dict }}"
  delegate_to: localhost
  run_once: true

- name: validate | Warn about partition slice nodes outside all nodegroups
  tags:
    - always
    - validate
  ansible.builtin.debug:
    msg: >-
      Nodes listed in partition slices but not in any of the inventory groups {{ _slurm_node_inventory_groups | join(', ') }},
      they will not join these partitions: {{ _slurm_unknown_slice_nodes | join(', ') }}
  when: _slurm_unknown_slice_nodes | length > 0
  vars:
    _slurm_node_inventory_groups: "{{ slurm_nodegroups | map(attribute='name') | map('regex_replace', '^', slurm_cluster_name ~ '_') }}"
    _slurm_nodegroup_hosts: "{{ groups | dict2items | selectattr('key', 'in', _slurm_node_inventory_groups) | map(attribute='value') | flatten | map('split', '.') | map('first') }}" # noqa: yaml[line-length]
    _slurm_unknown_slice_nodes: "{{ slurm_partitions | clip.hpc.slurm_slices | list | difference(_slurm_nodegroup_hosts) }}"
  delegate_to: localhost
  run_once: true
