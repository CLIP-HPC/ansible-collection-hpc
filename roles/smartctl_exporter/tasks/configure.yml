---
- name: configure | Ensure smartctl_exporter service is enabled/started
  ansible.builtin.systemd:
    name: smartctl_exporter
    enabled: "{{ smartctl_exporter_service_enabled }}"
    state: "{{ smartctl_exporter_service_state }}"
    daemon_reload: true
  become: true
  # In check mode a new or changed unit isn't written yet
  when: not (ansible_check_mode and smartctl_exporter_unit_file is changed)
